search --no-floppy --set=root --file /boot/bzImage	

set default=0
set timeout=5

insmod ext2
insmod fat
insmod iso9660

if [ "${grub_platform}" = "efi" ]; then
	insmod efi_gop
else
	insmod vbe
	insmod vga
fi

insmod font
if loadfont /boot/grub/fonts/unicode.pf2
then
        insmod gfxterm
        set gfxmode=auto
        set gfxpayload=keep
        terminal_output gfxterm

	insmod png
	insmod jpeg
	background_image /boot/grub/background.png
fi
menuentry 'PythOS Phoenix' --class os {
    insmod gzio
    insmod part_msdos
    linux /boot/bzImage
    echo "Loading Linux..."
    initrd /boot/initramfs.cpio.gz
    echo "Booting PythOS..."
}
if [ "${grub_platform}" = "efi" ]; then
	menuentry 'UEFI firmware settings' {
		fwsetup
	}
fi
